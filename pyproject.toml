[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "sfm-core"
version = "0.7.0"
description = "Social Fabric Matrix (SFM) graph service for institutional economics analysis"
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.9"
authors = [
    {name = "Garrick Dabbs", email = "gdabbs@redhat.com"}
]
keywords = [
    "social-fabric-matrix",
    "sfm",
    "institutional-economics",
    "hayden",
    "graph-analysis",
    "policy-analysis",
    "network-analysis",
    "ceremonial-instrumental",
    "circular-causation",
    "heterodox-economics",
    "computational-social-science",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Sociology",
    "Framework :: FastAPI",
]
dependencies = [
    "networkx>=3.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "requests>=2.31.0",
    "bleach>=6.0.0",
    "cachetools>=5.0.0",
    "redis>=4.0.0",
    "prometheus-client>=0.17.0",
    "PyYAML>=6.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "black>=23.0.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "pylint>=3.0.0",
    "httpx>=0.24.0",
]
neo4j = [
    "neo4j>=5.14.0",
]
visualization = [
    "matplotlib>=3.7.0",
    "pyvis>=0.3.0",
]
all = [
    "neo4j>=5.14.0",
    "matplotlib>=3.7.0",
    "pyvis>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/SFM-Graph-Service/sfm-core"
Documentation = "https://github.com/SFM-Graph-Service/sfm-core/tree/main/docs"
Repository = "https://github.com/SFM-Graph-Service/sfm-core"
Issues = "https://github.com/SFM-Graph-Service/sfm-core/issues"
Changelog = "https://github.com/SFM-Graph-Service/sfm-core/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "models*", "graph*", "data*", "scenarios*"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --tb=short"
testpaths = [
    "tests",
]
markers = [
    "integration: marks tests as integration tests (may be slow)",
    "unit: marks tests as unit tests",
    "component: marks tests as component tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["models", "graph", "data", "api"]

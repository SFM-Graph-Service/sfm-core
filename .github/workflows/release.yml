name: Release

# Creates a GitHub release with built sdist/wheel and the matching CHANGELOG
# section as notes. Runs automatically when a v* tag is pushed, or on demand
# from the Actions tab (Run workflow), which also creates the tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.10.0 (defaults to v<pyproject version>)"
        required: false
        default: ""
      publish_pypi:
        description: "Also publish to PyPI (requires a 'pypi' environment with trusted publishing)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve version and tag
        id: meta
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.tag }}"
            [ -z "$TAG" ] && TAG="v${VERSION}"
          fi
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "Tag ${TAG} does not match pyproject version ${VERSION}" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        run: |
          python - "${{ steps.meta.outputs.version }}" <<'EOF'
          import re, sys, pathlib
          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text()
          match = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          if not match or not match.group(1).strip():
              sys.exit(f"CHANGELOG.md has no section for {version}")
          pathlib.Path("RELEASE_NOTES.md").write_text(match.group(1).strip() + "\n")
          EOF
          echo "Release notes:"; head -20 RELEASE_NOTES.md

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Upload distributions as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          make_latest: true

  publish-pypi:
    name: Publish to PyPI
    needs: release
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_pypi) || (github.event_name == 'push' && vars.PUBLISH_PYPI == 'true') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

name: Test Examples

on:
  workflow_dispatch:
    inputs:
      timeout_minutes:
        description: 'Timeout in minutes for each example'
        required: false
        default: '5'
        type: string
      run_all_case_studies:
        description: 'Run all Hayden case studies (if false, only run basic ones)'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read

jobs:
  test-hayden-case-studies:
    name: Test Hayden Case Studies
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create example test results directory
        run: mkdir -p example-test-results

      - name: Discover and validate Hayden case study files
        run: |
          echo "Discovering Hayden case study files..."
          find examples/hayden_case_studies/ -name "*.py" -not -name "__init__.py" | sort > example-test-results/discovered_case_studies.txt
          echo "Found case study files:"
          cat example-test-results/discovered_case_studies.txt

          # List of case studies that should be tested
          echo "examples/hayden_case_studies/clean_air_act_1970.py" > example-test-results/expected_case_studies.txt
          echo "examples/hayden_case_studies/director_networks.py" >> example-test-results/expected_case_studies.txt
          echo "examples/hayden_case_studies/nebraska_k12_finance.py" >> example-test-results/expected_case_studies.txt
          echo "examples/hayden_case_studies/radioactive_waste.py" >> example-test-results/expected_case_studies.txt

          echo "Expected case studies:"
          cat example-test-results/expected_case_studies.txt

          # Check if all expected case studies exist
          missing=0
          while IFS= read -r study; do
            if [ ! -f "$study" ]; then
              echo "❌ Missing: $study"
              missing=$((missing + 1))
            else
              echo "✅ Found: $study"
            fi
          done < example-test-results/expected_case_studies.txt

          if [ $missing -gt 0 ]; then
            echo "⚠️ WARNING: $missing expected case studies are missing!"
          else
            echo "✅ All expected case studies found."
          fi

      - name: Test Clean Air Act 1970 Case Study
        id: test_clean_air
        continue-on-error: true
        run: |
          echo "Testing Clean Air Act 1970 Case Study..."
          timeout ${{ inputs.timeout_minutes }}m python -m examples.hayden_case_studies.clean_air_act_1970 > example-test-results/clean_air_act_output.txt 2>&1
          exit_code=$?
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
          if [ $exit_code -eq 0 ]; then
            echo "✅ Clean Air Act 1970: PASSED"
            echo "status=PASSED" >> $GITHUB_OUTPUT
          else
            echo "❌ Clean Air Act 1970: FAILED (exit code: $exit_code)"
            echo "status=FAILED" >> $GITHUB_OUTPUT
          fi

      - name: Test Director Networks Case Study
        id: test_directors
        continue-on-error: true
        run: |
          echo "Testing Director Networks Case Study..."
          timeout ${{ inputs.timeout_minutes }}m python -m examples.hayden_case_studies.director_networks > example-test-results/director_networks_output.txt 2>&1
          exit_code=$?
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
          if [ $exit_code -eq 0 ]; then
            echo "✅ Director Networks: PASSED"
            echo "status=PASSED" >> $GITHUB_OUTPUT
          else
            echo "❌ Director Networks: FAILED (exit code: $exit_code)"
            echo "status=FAILED" >> $GITHUB_OUTPUT
          fi

      - name: Test Nebraska K-12 Finance Case Study
        id: test_nebraska
        continue-on-error: true
        if: ${{ inputs.run_all_case_studies }}
        run: |
          echo "Testing Nebraska K-12 Finance Case Study..."
          timeout ${{ inputs.timeout_minutes }}m python -m examples.hayden_case_studies.nebraska_k12_finance > example-test-results/nebraska_k12_output.txt 2>&1
          exit_code=$?
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
          if [ $exit_code -eq 0 ]; then
            echo "✅ Nebraska K-12 Finance: PASSED"
            echo "status=PASSED" >> $GITHUB_OUTPUT
          else
            echo "❌ Nebraska K-12 Finance: FAILED (exit code: $exit_code)"
            echo "status=FAILED" >> $GITHUB_OUTPUT
          fi

      - name: Test Radioactive Waste Case Study
        id: test_radioactive
        continue-on-error: true
        if: ${{ inputs.run_all_case_studies }}
        run: |
          echo "Testing Radioactive Waste Case Study..."
          timeout ${{ inputs.timeout_minutes }}m python -m examples.hayden_case_studies.radioactive_waste > example-test-results/radioactive_waste_output.txt 2>&1
          exit_code=$?
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
          if [ $exit_code -eq 0 ]; then
            echo "✅ Radioactive Waste: PASSED"
            echo "status=PASSED" >> $GITHUB_OUTPUT
          else
            echo "❌ Radioactive Waste: FAILED (exit code: $exit_code)"
            echo "status=FAILED" >> $GITHUB_OUTPUT
          fi

      - name: Validate Case Study Outputs
        run: |
          echo "Validating case study outputs..."

          # Check for expected patterns in Clean Air Act output
          if [ -f example-test-results/clean_air_act_output.txt ]; then
            if grep -q -i "clean air\|matrix\|delivery" example-test-results/clean_air_act_output.txt; then
              echo "✅ Clean Air Act output validation: PASSED"
            else
              echo "❌ Clean Air Act output validation: FAILED - missing expected patterns"
              echo "Content preview:"
              head -20 example-test-results/clean_air_act_output.txt
            fi
          fi

          # Check for expected patterns in Director Networks output
          if [ -f example-test-results/director_networks_output.txt ]; then
            if grep -q -i "director\|network\|corporate" example-test-results/director_networks_output.txt; then
              echo "✅ Director Networks output validation: PASSED"
            else
              echo "❌ Director Networks output validation: FAILED - missing expected patterns"
            fi
          fi

          # Check Nebraska K-12 output (if run)
          if [ "${{ inputs.run_all_case_studies }}" == "true" ] && [ -f example-test-results/nebraska_k12_output.txt ]; then
            if grep -q -i "nebraska\|k-12\|education\|TEEOSA" example-test-results/nebraska_k12_output.txt; then
              echo "✅ Nebraska K-12 Finance output validation: PASSED"
            else
              echo "❌ Nebraska K-12 Finance output validation: FAILED - missing expected patterns"
            fi
          fi

          # Check Radioactive Waste output (if run)
          if [ "${{ inputs.run_all_case_studies }}" == "true" ] && [ -f example-test-results/radioactive_waste_output.txt ]; then
            if grep -q -i "radioactive\|waste\|compact" example-test-results/radioactive_waste_output.txt; then
              echo "✅ Radioactive Waste output validation: PASSED"
            else
              echo "❌ Radioactive Waste output validation: FAILED - missing expected patterns"
            fi
          fi

      - name: Generate Test Summary Report
        run: |
          echo "## Hayden Case Studies Test Results" > example-test-results/summary.md
          echo "" >> example-test-results/summary.md
          echo "### Test Configuration" >> example-test-results/summary.md
          echo "- Python Version: ${{ matrix.python-version }}" >> example-test-results/summary.md
          echo "- Timeout: ${{ inputs.timeout_minutes }} minutes" >> example-test-results/summary.md
          echo "- Run All Case Studies: ${{ inputs.run_all_case_studies }}" >> example-test-results/summary.md
          echo "- Test Date: $(date)" >> example-test-results/summary.md
          echo "- Workflow Run: ${{ github.run_number }}" >> example-test-results/summary.md
          echo "" >> example-test-results/summary.md

          echo "### Test Results" >> example-test-results/summary.md
          echo "" >> example-test-results/summary.md

          # Clean Air Act
          echo "#### Clean Air Act 1970" >> example-test-results/summary.md
          if [ "${{ steps.test_clean_air.outputs.status }}" == "PASSED" ]; then
            echo "- Status: ✅ PASSED" >> example-test-results/summary.md
          else
            echo "- Status: ❌ FAILED (exit code: ${{ steps.test_clean_air.outputs.exit_code }})" >> example-test-results/summary.md
          fi
          echo "" >> example-test-results/summary.md

          # Director Networks
          echo "#### Director Networks" >> example-test-results/summary.md
          if [ "${{ steps.test_directors.outputs.status }}" == "PASSED" ]; then
            echo "- Status: ✅ PASSED" >> example-test-results/summary.md
          else
            echo "- Status: ❌ FAILED (exit code: ${{ steps.test_directors.outputs.exit_code }})" >> example-test-results/summary.md
          fi
          echo "" >> example-test-results/summary.md

          # Nebraska K-12 (if run)
          if [ "${{ inputs.run_all_case_studies }}" == "true" ]; then
            echo "#### Nebraska K-12 Finance" >> example-test-results/summary.md
            if [ "${{ steps.test_nebraska.outputs.status }}" == "PASSED" ]; then
              echo "- Status: ✅ PASSED" >> example-test-results/summary.md
            elif [ "${{ steps.test_nebraska.outputs.status }}" == "FAILED" ]; then
              echo "- Status: ❌ FAILED (exit code: ${{ steps.test_nebraska.outputs.exit_code }})" >> example-test-results/summary.md
            else
              echo "- Status: ⚠️ SKIPPED OR ERROR" >> example-test-results/summary.md
            fi
            echo "" >> example-test-results/summary.md

            # Radioactive Waste
            echo "#### Radioactive Waste" >> example-test-results/summary.md
            if [ "${{ steps.test_radioactive.outputs.status }}" == "PASSED" ]; then
              echo "- Status: ✅ PASSED" >> example-test-results/summary.md
            elif [ "${{ steps.test_radioactive.outputs.status }}" == "FAILED" ]; then
              echo "- Status: ❌ FAILED (exit code: ${{ steps.test_radioactive.outputs.exit_code }})" >> example-test-results/summary.md
            else
              echo "- Status: ⚠️ SKIPPED OR ERROR" >> example-test-results/summary.md
            fi
          else
            echo "#### Advanced Case Studies" >> example-test-results/summary.md
            echo "- Status: ⏭️ SKIPPED (run_all_case_studies = false)" >> example-test-results/summary.md
          fi

          # Display summary
          cat example-test-results/summary.md

      - name: Check for Test Failures
        run: |
          failed_tests=0

          if [ "${{ steps.test_clean_air.outputs.status }}" == "FAILED" ]; then
            failed_tests=$((failed_tests + 1))
            echo "Clean Air Act 1970 case study failed"
          fi

          if [ "${{ steps.test_directors.outputs.status }}" == "FAILED" ]; then
            failed_tests=$((failed_tests + 1))
            echo "Director Networks case study failed"
          fi

          if [ "${{ inputs.run_all_case_studies }}" == "true" ]; then
            if [ "${{ steps.test_nebraska.outputs.status }}" == "FAILED" ]; then
              failed_tests=$((failed_tests + 1))
              echo "Nebraska K-12 Finance case study failed"
            fi

            if [ "${{ steps.test_radioactive.outputs.status }}" == "FAILED" ]; then
              failed_tests=$((failed_tests + 1))
              echo "Radioactive Waste case study failed"
            fi
          else
            echo "Advanced case studies were skipped (run_all_case_studies = false)"
          fi

          echo "Total failed tests: $failed_tests"

          if [ $failed_tests -gt 0 ]; then
            echo "❌ One or more case studies failed. Check the logs above for details."
            exit 1
          else
            echo "✅ All case studies passed successfully!"
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: case-study-test-results
          path: example-test-results/
          retention-days: 30

      - name: Upload test summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: case-study-test-summary
          path: example-test-results/summary.md
          retention-days: 30

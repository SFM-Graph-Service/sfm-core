version: '3.8'

services:
  # API with NetworkX backend (development)
  api-dev:
    build: .
    ports:
      - "8000:8000"
    environment:
      - STORAGE_TYPE=networkx
      - DEBUG=true
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:8080"]
      - GRAPH_SIZE_LIMIT=10000
    volumes:
      - .:/app
    command: uvicorn api.rest.app:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # API with Neo4j backend (production-like)
  api-neo4j:
    build: .
    ports:
      - "8001:8000"
    environment:
      - STORAGE_TYPE=neo4j
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=neo4j_password
      - DEBUG=false
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:8080"]
      - GRAPH_SIZE_LIMIT=100000
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Neo4j database
  neo4j:
    image: neo4j:5.15
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/neo4j_password
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_initial__size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "neo4j_password", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  neo4j_data:
  neo4j_logs:
